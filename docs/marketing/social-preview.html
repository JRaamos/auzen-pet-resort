<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Auzen — peças sociais em rascunho</title><style>
@font-face{font-family:Newsreader;src:url('/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2')}@font-face{font-family:Manrope;src:url('/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2')}
*{box-sizing:border-box}body{margin:0;padding:40px;background:#deddd3;color:#163f32;font-family:Manrope,Arial,sans-serif}.intro{max-width:1080px;margin:0 auto 40px}.intro h1{font:48px Newsreader,Georgia,serif}.cards{display:grid;gap:60px;justify-content:center}.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:#f5efe4}.post img{position:absolute;width:100%;height:860px;object-fit:cover;object-position:center 58%;top:0}.post:after{content:'';position:absolute;inset:620px 0 auto;height:240px;background:linear-gradient(transparent,#f5efe4)}.brand{position:absolute;top:54px;left:66px;background:#f5efe4;padding:20px 26px 14px;border-radius:0 0 28px 0;z-index:1;font:64px Newsreader,Georgia,serif;letter-spacing:-2px}.brand b{color:#b65333}.brand small{display:block;font:13px Manrope,Arial;letter-spacing:5px;text-align:center;margin-top:2px}.copy{position:absolute;top:820px;left:66px;right:66px;z-index:2}.eyebrow{font-size:17px;letter-spacing:3px;text-transform:uppercase;color:#ac4d31}.copy h2{font:68px/1.05 Newsreader,Georgia,serif;letter-spacing:-2px;margin:28px 0 34px;white-space:pre-line}.bottom{position:absolute;bottom:48px;left:66px;right:66px;border-top:1px solid #a4b0a0;padding-top:23px;display:flex;justify-content:space-between;font-size:20px}.index{font-size:14px;letter-spacing:2px}.caption{max-width:1080px;line-height:1.8;padding:24px;background:#faf8f2}.cover{height:720px}.cover img{height:100%;width:58%;left:42%}.cover:after{display:none}.cover .copy{top:265px;right:54%;}.cover h2{font-size:55px}.cover .bottom{right:54%;font-size:15px}.cover .brand{background:none}a{color:inherit}
</style></head><body><div class="intro"><h1>Auzen. Conteúdos para começar.</h1><p>Rascunhos não publicados. Fotografias reais do acervo autorizado. Revisar o recorte de cada plataforma antes de publicar.</p></div><div class="cards" id="cards"></div><script>
fetch('/docs/marketing/social-content.json').then(r=>r.json()).then(posts=>{const cards=document.getElementById('cards');for(const post of posts){const wrap=document.createElement('section');const article=document.createElement('article');article.className='post';article.id=post.id;const image=document.createElement('img');image.src='/public/images/'+post.image;image.alt=post.alt;article.append(image);const brand=document.createElement('div');brand.className='brand';brand.innerHTML='Auzen<b>.</b><small>PET RESORT</small>';article.append(brand);const copy=document.createElement('div');copy.className='copy';const eye=document.createElement('div');eye.className='eyebrow';eye.textContent=post.topic;const h=document.createElement('h2');h.textContent=post.title;copy.append(eye,h);article.append(copy);const bottom=document.createElement('div');bottom.className='bottom';bottom.innerHTML='<span>Lauro de Freitas · BA</span><span>@auzenpetresort ↗</span>';article.append(bottom);const caption=document.createElement('p');caption.className='caption';caption.textContent=post.caption;wrap.append(article,caption);cards.append(wrap)}const cover=cards.querySelector('article').cloneNode(true);cover.id='facebook-cover';cover.classList.add('cover');cover.querySelector('h2').textContent='Hotel e creche\npara cães.';cover.querySelector('.eyebrow').textContent='Auzen Pet Resort';cover.querySelector('.bottom').textContent='auzenpetresort.com.br';cards.append(cover);document.documentElement.dataset.ready='true'});
</script></body></html>
